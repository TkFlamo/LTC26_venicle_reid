seed: 42
device: auto
precision: bf16
run_dir: runs/reid/part_aware_v1
train_manifest: data/processed/hackathon/train.csv
val_manifest: data/processed/hackathon/val.csv
warmstart: runs/parts/dino_carparts/best.pt
hard_negative_map: null
epochs: 18
eval_every: 1
grad_accum: 1
grad_clip: 3.0
data:
  image_size:
  - 256
  - 384
  part_target_size:
  - 64
  - 96
  augmentation_profile: baseline_v4
  use_source_bbox: true
  bbox_pad: 0.03
  p: 16
  k: 4
  workers: 8
  eval_batch_size: 96
  batches_per_epoch: 450
model:
  backbone:
    profile: convnext_small
    model_name: convnext_small.dinov3_lvd1689m
    pretrained: false
    checkpoint_path: null
    dense_stage: -2
  global_head_mode: baseline_v4
  enable_parts: true
  embed_dim: 512
  part_dim: 160
  local_dim: 160
  local_grid:
  - 4
  - 6
  fusion_layers: 2
  fusion_heads: 8
  arc_scale: 30.0
  arc_margin: 0.35
  part_head_dim: 256
  part_head_blocks: 3
  part_attention_heads: 8
  part_prior_strength: 3.0
  part_visibility_threshold: 0.42
  part_visibility_topk: 3
  detach_semantic_prior: true
  part_dropout: 0.08
  fusion_max_residual: 0.25
  fusion_initial_gate: 0.01
optimizer:
  backbone_lr: 0.0
  head_lr: 0.0001
  part_head_lr: 6.0e-05
  weight_decay: 0.025
  warmup_fraction: 0.04
  freeze_backbone: true
  freeze_global_head: true
  freeze_part_head: true
loss:
  arcface: 0.0
  global_triplet: 0.0
  fused_triplet: 1.0
  global_supcon: 0.0
  local_triplet: 0.25
  part_consistency: 0.03
  part_supcon: 0.12
  part_triplet: 0.25
  triplet_margin: 0.2
  local_triplet_margin: 0.18
  part_triplet_margin: 0.14
  part_temperature: 0.08
  part_metric_min_score: 0.45
  global_distill: 0.0
  part_prob_distill: 0.0
evaluation:
  same_camera_policy: same_identity
  blend_alpha_grid:
  - 0.0
  - 0.03
  - 0.05
  - 0.1
  - 0.15
  - 0.25
  - 0.4
  - 0.7
  - 1.0
  official:
    evaluator: official/evaluate.py
    gt: data/processed/hackathon/official_val/ground_truth.csv
    query_manifest: data/processed/hackathon/official_val/query.csv
    gallery_manifest: data/processed/hackathon/official_val/gallery.csv
    top_k: 10
