[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-fingerprint-reid"
version = "0.9.4+ptdual"
description = "Falcon Tech vehicle ReID: fixed base_full + external_convnext_full PyTorch production ensemble"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "torch==2.3.1",
  "torchvision==0.18.1",
  "timm==1.0.20",
  "opencv-python-headless==4.10.0.84",
  "scikit-learn==1.5.2",
  "tqdm==4.66.5",
  "faiss-cpu==1.8.0.post1",
]

[project.optional-dependencies]
service = ["fastapi==0.115.0", "uvicorn[standard]==0.30.6", "python-multipart==0.0.9"]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
